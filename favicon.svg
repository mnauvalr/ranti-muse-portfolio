<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED79D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7730"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26221E"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Ring with Gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.2"/>
  
  <!-- Inner Delicate Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  
  <!-- Monogram Letter "R" (Serif Luxury Style) -->
  <text x="31" y="42" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" font-style="italic">R</text>
  
  <!-- Sparkle Accent (Top Right) -->
  <path d="M45 13 L46.3 17.5 L51 18.8 L46.3 20.1 L45 25 L43.7 20.1 L39 18.8 L43.7 17.5 Z" fill="#FFF2D6"/>
  <!-- Mini Sparkle Accent (Bottom Left) -->
  <circle cx="19" cy="45" r="1.5" fill="#EED79D"/>
</svg>
